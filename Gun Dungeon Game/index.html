<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter the Oven</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui-overlay">
    <div id="hud">
      <div id="health-bar-container">
        <span>HP</span>
        <div id="health-bar"><div id="health-fill"></div></div>
        <span id="health-text"></span>
      </div>
      <div id="xp-bar-container">
        <span>XP</span>
        <div id="xp-bar"><div id="xp-fill"></div></div>
        <span id="level-text">Lv 1</span>
      </div>
      <div id="ammo-display">∞</div>
    </div>
    <div id="minimap-container">
      <canvas id="minimap" width="120" height="120"></canvas>
    </div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="screen-login" class="screen auth-screen">
    <h1>GUNGEON SURVIVORS</h1>
    <div class="auth-container">
      <h2>LOGIN</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit">LOGIN</button>
        <p id="login-error" class="error-message"></p>
      </form>
      <p class="auth-toggle">Don't have an account? <a href="#" onclick="showRegister(event)">Register here</a></p>
    </div>
  </div>

  <!-- REGISTER SCREEN -->
  <div id="screen-register" class="screen auth-screen hidden">
    <h1>GUNGEON SURVIVORS</h1>
    <div class="auth-container">
      <h2>CREATE ACCOUNT</h2>
      <form id="register-form">
        <input type="text" id="register-username" placeholder="Username" required>
        <input type="email" id="register-email" placeholder="Email" required>
        <input type="password" id="register-password" placeholder="Password" required>
        <input type="password" id="register-confirm" placeholder="Confirm Password" required>
        <button type="submit">REGISTER</button>
        <p id="register-error" class="error-message"></p>
      </form>
      <p class="auth-toggle">Already have an account? <a href="#" onclick="showLogin(event)">Login here</a></p>
    </div>
  </div>

  <div id="screen-start" class="screen hidden">
    <h1>GUNGEON SURVIVORS</h1>
    <p>WASD / Arrow Keys — Move</p>
    <p>Mouse — Aim &amp; Shoot</p>
    <p>Kill enemies, level up, reach the boss!</p>
    <div id="user-info"></div>
    <button id="btn-start">START GAME</button>
    <button id="btn-logout">LOGOUT</button>
  </div>

  <div id="screen-levelup" class="screen hidden">
    <h2>LEVEL UP!</h2>
    <p>Choose a buff:</p>
    <div id="buff-choices"></div>
  </div>

  <div id="screen-gameover" class="screen hidden">
    <h2 id="gameover-title">GAME OVER</h2>
    <p id="gameover-msg"></p>
    <button id="btn-restart">PLAY AGAIN</button>
  </div>

  <canvas id="game-canvas"></canvas>

  <!-- Authentication -->
  <script src="js/auth.js"></script>
  <!-- Core (no dependencies) -->
  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <!-- Input -->
  <script src="js/input.js"></script>
  <!-- World / physics -->
  <script src="js/world.js"></script>
  <!-- Effects & progression -->
  <script src="js/particles.js"></script>
  <script src="js/buffs.js"></script>
  <!-- Combat -->
  <script src="js/bullets.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/player.js"></script>
  <!-- Presentation -->
  <script src="js/renderer.js"></script>
  <script src="js/hud.js"></script>
  <!-- Orchestration -->
  <script src="js/main.js"></script>
</body>
</html>
