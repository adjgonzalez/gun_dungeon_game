services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gun-dungeon-app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/gun_dungeon_game
      JWT_SECRET: ${JWT_SECRET:-change_me_before_deploy}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
    ports:
      - "5000:5000"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: gun-dungeon-mongo
    environment:
      MONGO_INITDB_DATABASE: gun_dungeon_game
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
